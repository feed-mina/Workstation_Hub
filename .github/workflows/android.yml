name: Android build
on:
  push:
    branches: [mobile]
    paths: ['android/**', 'ui/**', 'tests/mobile-bridge.cjs', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'ui/**', 'tests/mobile-bridge.cjs', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bridge shim regression
        run: node tests/mobile-bridge.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkstationHub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
